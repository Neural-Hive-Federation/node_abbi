<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ABBIE × CoreTextil | Control de Producción Inteligente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --abbie-pink: #f78bc9;
      --abbie-red: #c0192e;
      --abbie-text: #231f20;
      --abbie-white: #ffffff;
      --core-green: #10b981;
      --core-purple: #8b5cf6;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--abbie-pink) 0%, #f9c2d9 100%);
      color: var(--abbie-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: var(--abbie-white);
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    .brand-name {
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--abbie-red);
      font-size: 1.5rem;
    }
    .card-ghost {
      background: var(--abbie-white);
      border: 0;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
      border-radius: 12px;
      overflow: hidden;
      border-left: 5px solid var(--abbie-pink);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card-ghost:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(0,0,0,.14);
    }
    .card-core {
      border-left: 5px solid var(--core-purple) !important;
      background: linear-gradient(to right, #ffffff, #faf7ff);
    }
    .btn-abbie {
      background: var(--abbie-red);
      border-color: var(--abbie-red);
      color: #fff;
      font-weight: 500;
      padding: .55rem 1.2rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .btn-abbie:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 12px rgba(192,25,46,.3);
      color: #fff;
    }
    .btn-core {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      border: 0;
      color: #fff;
      font-weight: 500;
      padding: .55rem 1.2rem;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      transition: all 0.2s ease;
    }
    .btn-core:hover {
      filter: brightness(1.1);
      color: #fff;
      transform: translateY(-1px);
    }
    .chip {
      display: inline-block;
      padding: .3rem .8rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--abbie-white);
      background: linear-gradient(45deg, var(--abbie-red), #f73d57);
      box-shadow: 0 2px 8px rgba(192,25,46,.4);
    }
    .chip-core {
      background: linear-gradient(45deg, #7c3aed, #ec4899);
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
